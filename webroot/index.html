<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" type="text/css" href="/internal/insets.css" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>玩转三段式</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* ===== Theme Variables ===== */
:root{
  /* Dark (default) */
  --bg: #121214;
  --card-bg: rgba(255,255,255,0.06);
  --card-border: rgba(255,255,255,0.06);
  --card-shadow: 0 4px 24px rgba(0,0,0,0.35), 0 1px 4px rgba(0,0,0,0.1);
  --text-primary: #f5f5f7;
  --text-secondary: #98989d;
  --text-tertiary: #636366;
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --green: #30d158;
  --purple: #bf5af2;
  --orange: #ff9f0a;
  --red: #ff453a;
  --separator: rgba(255,255,255,0.05);
  --picker-bg: rgba(118,118,128,0.12);
  --picker-hover: rgba(118,118,128,0.2);
  --panel-bg: rgba(28,28,30,var(--dp-alpha, 0.08));
  --panel-border: rgba(255,255,255,0.08);
  --highlight: rgba(0,113,227,0.2);
  --toggle-bg: #39393d;
  --toggle-knob: #fff;
}
[data-theme="light"]{
  --bg: #f5f5f7;
  --card-bg: rgba(255,255,255,0.45);
  --card-border: rgba(0,0,0,0.04);
  --card-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.03);
  --text-primary: #1d1d1f;
  --text-secondary: #86868b;
  --text-tertiary: #aeaeb2;
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --green: #34c759;
  --purple: #af52de;
  --orange: #ff9500;
  --red: #ff3b30;
  --separator: rgba(0,0,0,0.06);
  --picker-bg: rgba(118,118,128,0.08);
  --picker-hover: rgba(118,118,128,0.14);
  --panel-bg: rgba(255,255,255,var(--dp-alpha, 0.08));
  --panel-border: rgba(0,0,0,0.06);
  --highlight: rgba(0,113,227,0.1);
  --toggle-bg: #e9e9ea;
  --toggle-knob: #fff;
}

html{font-size:16px;background: var(--bg);transition: background 0.5s ease; margin:0; padding:0; border:none;}
body{
  background: var(--bg);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px 48px;
  margin:0;
  transition: background 0.5s ease, color 0.3s ease;
}
.page{max-width: 400px;width: 100%;position: relative; margin-top:0; padding-top:var(--safe-area-inset-top);}

/* ===== Theme Toggle (Top Right) ===== */
.theme-toggle{
  position: absolute;
  top: calc(16px + var(--safe-area-inset-top));
  right: 0;
  width: 36px;height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  cursor: pointer;
  display: flex;align-items: center;justify-content: center;
  transition: all 0.35s cubic-bezier(0.25,0.1,0.25,1);
  color: var(--text-secondary);
  -webkit-tap-highlight-color: transparent;
  z-index: 10;
}
.theme-toggle:hover{background: var(--picker-hover);transform: scale(1.08);}
.theme-toggle:active{transform: scale(0.92);}
.theme-toggle svg{
  width: 18px;height: 18px;
  fill: currentColor;
  transition: transform 0.4s cubic-bezier(0.25,0.1,0.25,1);
}
.theme-toggle .sun{display: none;}
[data-theme="light"] .theme-toggle .moon{display: none;}
[data-theme="light"] .theme-toggle .sun{display: block;}
.theme-toggle:active svg{transform: rotate(180deg);}

/* ===== Header ===== */
.header{
  text-align: center;
  padding: 40px 0 28px;
  animation: fadeUp 0.6s cubic-bezier(0.25,0.1,0.25,1) both;
}
.header-icon{
  width: 64px;height: 64px;
  background: linear-gradient(135deg, #0071e3, #40a9ff);
  border-radius: 18px;
  display: flex;align-items: center;justify-content: center;
  margin: 0 auto 16px;
  box-shadow: 0 8px 32px rgba(0,113,227,0.3);
  transition: transform 0.3s ease;
}
.header-icon:hover{transform: scale(1.04);}
.header-icon svg{width: 30px;height: 30px;fill: #fff;}
.header h1{
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  line-height: 1.2;
}
.header p{
  font-size: 15px;
  color: var(--text-secondary);
  margin-top: 6px;
  font-weight: 400;
  letter-spacing: -0.01em;
}

/* ===== Status Pills ===== */
.status-bar{
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 24px;
  animation: fadeUp 0.6s cubic-bezier(0.25,0.1,0.25,1) both;
  animation-delay: 0.1s;
}
.status-pill{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  padding: 6px 14px 6px 10px;
  border-radius: 980px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  box-shadow: 0 1px 4px rgba(0,0,0,0.02);
  transition: all 0.3s ease;
}
.status-pill .dot{
  width: 7px;height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.status-pill .dot.up{background: var(--green);}
.status-pill .dot.mid{background: var(--purple);}
.status-pill .dot.dn{background: var(--orange);}
.status-pill .val{
  color: var(--text-primary);
  font-weight: 600;
  max-width: 80px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.status-pill .val.active{
  color: var(--orange);
}

/* ===== Cards ===== */
.card{
  background: var(--card-bg);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--card-border);
  border-radius: 18px;
  box-shadow: var(--card-shadow);
  padding: 6px 0;
  margin-bottom: 16px;
  animation: fadeUp 0.6s cubic-bezier(0.25,0.1,0.25,1) both;
  animation-delay: 0.15s;
  transition: background 0.5s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}
.card.shield-card{
  padding: 0;
  animation-delay: 0.2s;
}

/* ===== Function Row ===== */
.func-row{
  display: flex;
  align-items: center;
  padding: 10px 18px;
  gap: 12px;
  min-height: 56px;
}
.func-row + .func-row{
  border-top: 1px solid var(--separator);
}
.func-label{
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 500;
  color: var(--text-primary);
  min-width: 44px;
  flex-shrink: 0;
  letter-spacing: -0.01em;
}
.func-label .dot{
  width: 9px;height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dot.up{background: var(--green);}
.dot.mid{background: var(--purple);}
.dot.dn{background: var(--orange);}

/* ===== Picker ===== */
.func-select-wrap{flex: 1;position: relative;}
.func-picker{
  width: 100%;
  background: var(--picker-bg);
  border: none;
  border-radius: 10px;
  color: var(--text-primary);
  padding: 10px 34px 10px 14px;
  font-size: 15px;
  font-weight: 400;
  cursor: pointer;
  user-select: none;
  transition: all 0.2s ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  -webkit-tap-highlight-color: transparent;
  position: relative;
  text-align: left;
  letter-spacing: -0.01em;
}
.func-picker:hover{background: var(--picker-hover);}
.func-picker:active{transform: scale(0.98);}
.func-picker::after{
  content: "";
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 10px;height: 10px;
  border-right: 2px solid var(--text-tertiary);
  border-bottom: 2px solid var(--text-tertiary);
  transform: translateY(-50%) rotate(45deg);
  margin-top: -3px;
  transition: transform 0.25s ease;
}
.func-picker.active::after{
  transform: translateY(-50%) rotate(-135deg);
  margin-top: 3px;
}

/* ===== Dropdown ===== */
.dropdown-panel{
  position: fixed;
  z-index: 1000;
  background: var(--panel-bg);
  backdrop-filter: blur(var(--dp-blur, 1px));
  -webkit-backdrop-filter: blur(var(--dp-blur, 1px));
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  box-shadow: 0 8px 48px rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.06);
  padding: 6px;
  max-height: 320px;
  overflow-y: auto;
  opacity: 0;
  transform: scale(0.92) translateY(-8px);
  transition: opacity 0.2s cubic-bezier(0.25,0.1,0.25,1), transform 0.25s cubic-bezier(0.25,0.1,0.25,1);
  pointer-events: none;
  min-width: 200px;
}
.dropdown-panel.show{
  opacity: 1;
  transform: scale(1) translateY(0);
  pointer-events: auto;
}
.dropdown-panel .opt{
  padding: 12px 14px;
  font-size: 15px;
  font-weight: 400;
  color: var(--text-primary);
  cursor: pointer;
  border-radius: 10px;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: -0.01em;
  -webkit-tap-highlight-color: transparent;
}
.dropdown-panel .opt:hover{background: var(--picker-hover);}
.dropdown-panel .opt:active{transform: scale(0.98);}
.dropdown-panel .opt.selected{
  color: var(--orange);
  font-weight: 600;
  background: var(--highlight);
}
.dropdown-panel .opt.selected::after{
  content: "✓";
  margin-left: auto;
  font-weight: 700;
  color: var(--orange);
  font-size: 16px;
}
.dropdown-panel .opt + .opt{margin-top: 2px;}
.dropdown-panel::-webkit-scrollbar{width: 4px;}
.dropdown-panel::-webkit-scrollbar-track{background: transparent;}
.dropdown-panel::-webkit-scrollbar-thumb{
  background: rgba(255,255,255,0.12);
  border-radius: 4px;
}
[data-theme="light"] .dropdown-panel::-webkit-scrollbar-thumb{
  background: rgba(0,0,0,0.1);
}

/* ===== Shield ===== */
.shield-row{
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  gap: 12px;
}
.shield-left{
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
}
.shield-icon{
  width: 34px;height: 34px;
  background: rgba(255,69,58,0.12);
  border-radius: 9px;
  display: flex;align-items: center;justify-content: center;
  flex-shrink: 0;
}
.shield-icon svg{width: 17px;height: 17px;fill: var(--red);}
.shield-text{
  font-size: 15px;
  font-weight: 500;
  color: var(--text-primary);
  line-height: 1.3;
}
.shield-text small{
  display: block;
  font-size: 12px;
  font-weight: 400;
  color: var(--text-secondary);
  margin-top: 2px;
  letter-spacing: -0.01em;
}

/* ===== Toggle ===== */
.toggle{
  position: relative;
  display: inline-block;
  width: 51px;
  height: 31px;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.toggle input{opacity: 0;width: 0;height: 0;}
.toggle .sl{
  position: absolute;
  cursor: pointer;
  inset: 0;
  background: var(--toggle-bg);
  border-radius: 31px;
  transition: background 0.3s cubic-bezier(0.25,0.1,0.25,1);
}
.toggle .sl::before{
  content: "";
  position: absolute;
  height: 27px;width: 27px;
  left: 2px;bottom: 2px;
  background: var(--toggle-knob);
  border-radius: 50%;
  transition: all 0.3s cubic-bezier(0.25,0.1,0.25,1);
  box-shadow: 0 2px 6px rgba(0,0,0,0.15), 0 1px 2px rgba(0,0,0,0.05);
}
.toggle input:checked + .sl{background: var(--green);}
.toggle input:checked + .sl::before{transform: translateX(20px);}

/* ===== Save Button ===== */
.btn-save{
  width: 100%;
  padding: 14px 24px;
  border: none;
  border-radius: 980px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  background: var(--accent);
  color: #fff;
  letter-spacing: -0.01em;
  transition: all 0.25s cubic-bezier(0.25,0.1,0.25,1);
  box-shadow: 0 4px 16px rgba(0,113,227,0.25);
  -webkit-tap-highlight-color: transparent;
  animation: fadeUp 0.6s cubic-bezier(0.25,0.1,0.25,1) both;
  animation-delay: 0.25s;
}
.btn-save:hover{
  background: var(--accent-hover);
  transform: scale(1.01);
  box-shadow: 0 6px 20px rgba(0,113,227,0.35);
}
.btn-save:active{transform: scale(0.97);}

/* ===== Toast ===== */
.toast{
  position: fixed;
  bottom: 48px;
  left: 50%;
  transform: translateX(-50%) translateY(24px);
  background: rgba(0,0,0,0.82);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: #fff;
  padding: 12px 28px;
  border-radius: 980px;
  font-size: 14px;
  font-weight: 500;
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.25,0.1,0.25,1);
  z-index: 999;
  pointer-events: none;
  white-space: nowrap;
  letter-spacing: -0.01em;
}
.toast.show{
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ===== Footer ===== */
.footer{
  text-align: center;
  margin-top: 32px;
  animation: fadeUp 0.6s cubic-bezier(0.25,0.1,0.25,1) both;
  animation-delay: 0.3s;
}
.footer .version{
  font-size: 12px;
  font-weight: 500;
  color: var(--text-tertiary);
  letter-spacing: 0.02em;
}
.footer .contact{
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 4px;
  letter-spacing: 0.01em;
}

/* ===== Animations ===== */
/* ===== Hamburger Menu Button ===== */
.menu-btn{
  position: absolute;
  top: calc(16px + var(--safe-area-inset-top));
  left: 0;
  width: 36px;height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  cursor: pointer;
  display: flex;align-items: center;justify-content: center;
  transition: all 0.35s cubic-bezier(0.25,0.1,0.25,1);
  color: var(--text-secondary);
  -webkit-tap-highlight-color: transparent;
  z-index: 10;
}
.menu-btn:hover{background: var(--picker-hover);transform: scale(1.08);}
.menu-btn:active{transform: scale(0.92);}
.menu-btn svg{width: 18px;height: 18px;fill: currentColor;}

/* ===== Backdrop ===== */
.modal-backdrop{
  position: fixed;inset: 0;z-index: 998;
  background: rgba(0,0,0,0.4);
  opacity: 0;pointer-events: none;
  transition: opacity 0.3s ease;
}
.modal-backdrop.show{opacity: 1;pointer-events: auto;}

/* ===== Action Sheet ===== */
.action-sheet{
  position: fixed;
  left: 50%;bottom: 0;
  transform: translateX(-50%) translateY(100%);
  width: 100%;max-width: 400px;
  z-index: 999;
  padding: 8px 16px 32px;
  transition: transform 0.35s cubic-bezier(0.25,0.1,0.25,1);
}
.action-sheet.show{transform: translateX(-50%) translateY(0);}
.action-sheet .item{
  background: var(--panel-bg);
  backdrop-filter: blur(var(--dp-blur, 28px));
  -webkit-backdrop-filter: blur(var(--dp-blur, 28px));
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 16px 20px;
  font-size: 17px;
  font-weight: 500;
  color: var(--text-primary);
  cursor: pointer;
  display: flex;align-items: center;gap: 14px;
  transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.action-sheet .item + .item{margin-top: 8px;}
.action-sheet .item:hover{background: var(--picker-hover);}
.action-sheet .item:active{transform: scale(0.98);}
.action-sheet .item .icon{
  width: 28px;height: 28px;
  border-radius: 8px;
  display: flex;align-items: center;justify-content: center;
  flex-shrink: 0;
}
.action-sheet .item .icon svg{width: 16px;height: 16px;fill: #fff;}
.action-sheet .item .icon.settings{background: var(--accent);}
.action-sheet .item .icon.about{background: var(--orange);}
.action-sheet .cancel{
  margin-top: 8px;
  background: var(--panel-bg);
  backdrop-filter: blur(var(--dp-blur, 28px));
  -webkit-backdrop-filter: blur(var(--dp-blur, 28px));
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 16px;
  font-size: 17px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.action-sheet .cancel:hover{background: var(--picker-hover);}
.action-sheet .cancel:active{transform: scale(0.98);}

/* ===== No Blur Override ===== */
.no-blur,
.no-blur *{
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}

/* ===== Modal ===== */
.modal{
  position: fixed;
  left: 50%;top: 50%;
  transform: translate(-50%,-50%) scale(0.92);
  width: calc(100% - 32px);max-width: 368px;
  z-index: 999;
  background: var(--panel-bg);
  backdrop-filter: blur(var(--dp-blur, 28px));
  -webkit-backdrop-filter: blur(var(--dp-blur, 28px));
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 24px 20px 20px;
  box-shadow: 0 16px 64px rgba(0,0,0,0.2);
  opacity: 0;pointer-events: none;
  transition: all 0.3s cubic-bezier(0.25,0.1,0.25,1);
}
.modal.show{opacity: 1;pointer-events: auto;transform: translate(-50%,-50%) scale(1);}
.modal h2{
  font-size: 20px;font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
  letter-spacing: -0.02em;
}
.modal p{
  font-size: 14px;color: var(--text-secondary);
  margin-bottom: 20px;letter-spacing: -0.01em;
}
.modal .close-btn{
  position: absolute;top: 16px;right: 16px;
  width: 28px;height: 28px;border-radius: 50%;
  border: none;background: var(--picker-bg);
  color: var(--text-secondary);cursor: pointer;
  display: flex;align-items: center;justify-content: center;
  transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.modal .close-btn:hover{background: var(--picker-hover);}
.modal .close-btn svg{width: 14px;height: 14px;fill: currentColor;}

/* ===== Slider ===== */
.slider-group{margin-bottom: 20px;}
.slider-group:last-of-type{margin-bottom: 24px;}
.slider-label{
  display: flex;justify-content: space-between;align-items: center;
  margin-bottom: 8px;
}
.slider-label span:first-child{
  font-size: 15px;font-weight: 500;color: var(--text-primary);
  letter-spacing: -0.01em;
}
.slider-label span:last-child{
  font-size: 15px;font-weight: 600;color: var(--accent);
  min-width: 48px;text-align: right;
}
input[type="range"]{
  width: 100%;height: 4px;
  -webkit-appearance: none;appearance: none;
  background: var(--picker-bg);
  border-radius: 4px;outline: none;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance: none;
  width: 20px;height: 20px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid rgba(255,255,255,0.8);
  box-shadow: 0 2px 8px rgba(0,113,227,0.3);
  cursor: pointer;
  transition: transform 0.15s ease;
}
input[type="range"]::-webkit-slider-thumb:active{transform: scale(1.15);}

/* ===== About Content ===== */
.about-content{text-align: center;padding: 8px 0;}
.about-content .logo{
  width: 56px;height: 56px;
  background: linear-gradient(135deg,#0071e3,#40a9ff);
  border-radius: 16px;
  display: flex;align-items: center;justify-content: center;
  margin: 0 auto 12px;
}
.about-content .logo svg{width: 26px;height: 26px;fill: #fff;}
.about-content .name{font-size: 18px;font-weight: 700;color: var(--text-primary);}
.about-content .ver{font-size: 13px;color: var(--text-tertiary);margin: 4px 0 12px;}
.about-content .desc{
  font-size: 14px;color: var(--text-secondary);line-height: 1.5;
  max-width: 280px;margin: 0 auto;
}
.about-content .contact{
  margin-top: 12px;font-size: 12px;color: var(--text-tertiary);
}

/* ===== Modal Save Button ===== */
.modal .btn-primary{
  width: 100%;padding: 12px;
  border: none;border-radius: 12px;
  font-size: 16px;font-weight: 600;
  background: var(--accent);color: #fff;
  cursor: pointer;
  transition: all 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.modal .btn-primary:hover{background: var(--accent-hover);}

<script>
// ===== Theme Toggle =====
function toggleTheme(){
  const html=document.documentElement;
  const current=html.getAttribute('data-theme');
  const next=current==='light'?'dark':'light';
  html.setAttribute('data-theme',next);
  try{localStorage.setItem('trikey_theme',next)}catch(e){}
}
(function(){
  try{
    const saved=localStorage.getItem('trikey_theme');
    if(saved)document.documentElement.setAttribute('data-theme',saved);
  }catch(e){}
})();

// ===== KSU Exec =====
function exec(cmd){
  return new Promise((resolve)=>{
    const cb='ksu_cb_'+Date.now();
    window[cb]=(err,out)=>{resolve({errno:err,stdout:out||''});delete window[cb]};
    try{ksu.exec(cmd,JSON.stringify({}),cb)}
    catch(e){resolve({errno:1,stdout:String(e)})}
  });
}
const CONFIG_PATH='/data/local/tmp/tri_key/tri_key_config.sh';
const OPTIONS=[
  {value:'off',label:'关闭'},
  {value:'record',label:'后台录音'},
  {value:'screenrecord',label:'录屏'},
  {value:'screenshot',label:'截屏'},
  {value:'ai_chat',label:'AI实景对话'},
  {value:'music_recognize',label:'音乐识别'},
  {value:'flashlight',label:'手电筒'},
  {value:'wechat_scan',label:'微信扫一扫'},
  {value:'wechat_pay',label:'微信付款码'},
  {value:'alipay_scan',label:'支付宝扫一扫'},
  {value:'alipay_pay',label:'支付宝付款码'},
  {value:'camera_open',label:'打开相机'},
  {value:'xiaobu_screen',label:'小布识屏'},
  {value:'xiaobu_flashnote',label:'小布闪记'},
  {value:'ai_voice_note',label:'AI语音摘记'},
  {value:'calculator',label:'计算器'}
];
let activePicker=null;

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show';
  setTimeout(()=>t.className='toast',2000);
}

function openDropdown(picker){
  const rect=picker.getBoundingClientRect();
  const panel=document.getElementById('dropdownPanel');
  const selectId=picker.dataset.target;
  const select=document.getElementById(selectId);
  const currentVal=select.value;
  panel.innerHTML='';
  OPTIONS.forEach(opt=>{
    const div=document.createElement('div');
    div.className='opt'+(opt.value===currentVal?' selected':'');
    div.textContent=opt.label;
    div.dataset.value=opt.value;
    div.onclick=function(e){
      e.stopPropagation();
      select.value=opt.value;
      picker.textContent=opt.label;
      closeDropdown();
      picker.classList.remove('active');
    };
    panel.appendChild(div);
  });
  const panelW=Math.max(200,Math.min(280,window.innerWidth-32));
  let left=rect.left+(rect.width-panelW)/2;
  if(left<8)left=8;
  if(left+panelW>window.innerWidth-8)left=window.innerWidth-8-panelW;
  panel.style.left=left+'px';
  panel.style.top=(rect.bottom+8)+'px';
  panel.style.width=panelW+'px';
  panel.classList.add('show');
  picker.classList.add('active');
  activePicker=picker;
}

function closeDropdown(){
  const panel=document.getElementById('dropdownPanel');
  panel.classList.remove('show');
  if(activePicker){activePicker.classList.remove('active');activePicker=null;}
}

document.addEventListener('click',function(e){
  const picker=e.target.closest('.func-picker');
  if(picker){
    e.stopPropagation();
    if(activePicker===picker && document.getElementById('dropdownPanel').classList.contains('show')){
      closeDropdown();
    }else{openDropdown(picker);}
    return;
  }
  closeDropdown();
});

async function readConfig(){
  const r=await exec('cat '+CONFIG_PATH);
  if(r.errno!==0){
    // 读取失败时使用默认值
    const defUp='off',defMid='off',defDn='off',defShield='0';
    document.getElementById('upSel').value=defUp;
    document.getElementById('midSel').value=defMid;
    document.getElementById('dnSel').value=defDn;
    document.getElementById('upPicker').textContent=OPTIONS.find(o=>o.value===defUp)?.label||'关闭';
    document.getElementById('midPicker').textContent=OPTIONS.find(o=>o.value===defMid)?.label||'关闭';
    document.getElementById('dnPicker').textContent=OPTIONS.find(o=>o.value===defDn)?.label||'关闭';
    document.getElementById('shieldToggle').checked=defShield==='1';
    document.getElementById('upCur').textContent=defUp;document.getElementById('upCur').classList.toggle('active',defUp!=='off');
    document.getElementById('midCur').textContent=defMid;document.getElementById('midCur').classList.toggle('active',defMid!=='off');
    document.getElementById('dnCur').textContent=defDn;document.getElementById('dnCur').classList.toggle('active',defDn!=='off');
    // 创建默认配置文件
    exec('mkdir -p /data/local/tmp/tri_key 2>/dev/null');
    exec('echo "#!/system/bin/sh" > /data/local/tmp/tri_key/tri_key_config.sh');
    exec('echo "UP_FUNC=\\"'+defUp+'\\"" >> /data/local/tmp/tri_key/tri_key_config.sh');
    exec('echo "MID_FUNC=\\"'+defMid+'\\"" >> /data/local/tmp/tri_key/tri_key_config.sh');
    exec('echo "DOWN_FUNC=\\"'+defDn+'\\"" >> /data/local/tmp/tri_key/tri_key_config.sh');
    exec('echo "CUSTOM_CMD=\\"echo hello\\"" >> /data/local/tmp/tri_key/tri_key_config.sh');
    exec('echo "SHIELD_TRIKEY=\\"'+defShield+'\\"" >> /data/local/tmp/tri_key/tri_key_config.sh');
    return;
  }
  const up=r.stdout.match(/UP_FUNC="([^"]*)"/);
  const mid=r.stdout.match(/MID_FUNC="([^"]*)"/);
  const dn=r.stdout.match(/DOWN_FUNC="([^"]*)"/);
  const shield=r.stdout.match(/SHIELD_TRIKEY="([^"]*)"/);
  const upVal=up?up[1]:'off';
  const midVal=mid?mid[1]:'off';
  const dnVal=dn?dn[1]:'off';
  document.getElementById('upSel').value=upVal;
  document.getElementById('midSel').value=midVal;
  document.getElementById('dnSel').value=dnVal;
  document.getElementById('upPicker').textContent=OPTIONS.find(o=>o.value===upVal)?.label||'关闭';
  document.getElementById('midPicker').textContent=OPTIONS.find(o=>o.value===midVal)?.label||'关闭';
  document.getElementById('dnPicker').textContent=OPTIONS.find(o=>o.value===dnVal)?.label||'关闭';
  document.getElementById('shieldToggle').checked=shield&&shield[1]==='1';
  document.getElementById('upCur').textContent=upVal;document.getElementById('upCur').classList.toggle('active',upVal!=='off');
  document.getElementById('midCur').textContent=midVal;document.getElementById('midCur').classList.toggle('active',midVal!=='off');
  document.getElementById('dnCur').textContent=dnVal;document.getElementById('dnCur').classList.toggle('active',dnVal!=='off');
}

async function apply(){
  const up=document.getElementById('upSel').value;
  const mid=document.getElementById('midSel').value;
  const dn=document.getElementById('dnSel').value;
  const shield=document.getElementById('shieldToggle').checked?'1':'0';
  toast('保存中…');
  const cfg=CONFIG_PATH;
  const lines=[
    'echo "#!/system/bin/sh" > '+cfg,
    'echo "UP_FUNC=\\"'+up+'\\"" >> '+cfg,
    'echo "MID_FUNC=\\"'+mid+'\\"" >> '+cfg,
    'echo "DOWN_FUNC=\\"'+dn+'\\"" >> '+cfg,
    'echo "CUSTOM_CMD=\\"echo hello\\"" >> '+cfg,
    'echo "SHIELD_TRIKEY=\\"'+shield+'\\"" >> '+cfg
  ];
  const cmd=lines.join(' && ');
  const r=await exec(cmd);
  if(r.errno!==0){toast('保存失败');return;}
  const now=new Date();
  const ts=('0'+(now.getMonth()+1)).slice(-2)+'-'+('0'+now.getDate()).slice(-2)+' '+('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2)+':'+('0'+now.getSeconds()).slice(-2);
  exec('echo "['+ts+'] 配置已保存 (上拨:'+up+' 中拨:'+mid+' 下拨:'+dn+')" >> /data/local/tmp/tri_key/tri_key.log');
  await exec('kill -9 $(cat /data/local/tmp/tri_key/monitor.pid 2>/dev/null) 2>/dev/null');
  document.getElementById('upCur').textContent=up;document.getElementById('upCur').classList.toggle('active',up!=='off');
  document.getElementById('midCur').textContent=mid;document.getElementById('midCur').classList.toggle('active',mid!=='off');
  document.getElementById('dnCur').textContent=dn;document.getElementById('dnCur').classList.toggle('active',dn!=='off');
  toast('已保存 ✓');
}

  document.getElementById('actionSheet').classList.add('show');
  document.getElementById('modalBackdrop').classList.add('show');
}

  document.getElementById('actionSheet').classList.remove('show');

async function refreshLog(){
  const el = document.getElementById('logContent');
  el.textContent = '加载中...';
  const res = await exec('cat /data/local/tmp/tri_key/tri_key.log 2>/dev/null | tail -200');
  if(res.errno === 0 && res.stdout){
    el.textContent = res.stdout || '(日志为空)';
  } else {
    el.textContent = '读取失败: ' + (res.stdout || '无权限或文件不存在');
  }
  el.scrollTop = el.scrollHeight;
}
function openSettings(){
  closeAll();
  const blur = localStorage.getItem('trikey_dp_blur') || '1';
  const alpha = localStorage.getItem('trikey_dp_alpha') || '8';
  document.getElementById('blurSlider').value = blur;
  document.getElementById('alphaSlider').value = alpha;
  document.getElementById('blurVal').textContent = blur + 'px';
  document.getElementById('alphaVal').textContent = (alpha/100).toFixed(2);
  document.getElementById('settingsModal').classList.add('show');
  document.getElementById('modalBackdrop').classList.add('show');
}
function openAbout(){
  closeAll();
  document.getElementById('aboutModal').classList.add('show');
  document.getElementById('modalBackdrop').classList.add('show');
}
function updateBlur(val){
  document.getElementById('blurVal').textContent = val + 'px';
  document.documentElement.style.setProperty('--dp-blur', val + 'px');
  localStorage.setItem('trikey_dp_blur', val);
  const ids = ['dropdownPanel', 'actionSheet', 'settingsModal', 'aboutModal'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    if(val == 0){
      el.classList.add('no-blur');
    }else{
      el.classList.remove('no-blur');
    }
  });
}
function updateAlpha(val){
  const a = (val/100).toFixed(2);
  document.getElementById('alphaVal').textContent = a;
  document.documentElement.style.setProperty('--dp-alpha', a);
  localStorage.setItem('trikey_dp_alpha', val);
}
function saveDpSettings(){
  const blur = document.getElementById('blurSlider').value;
  const alpha = document.getElementById('alphaSlider').value;
  localStorage.setItem('trikey_dp_blur', blur);
  localStorage.setItem('trikey_dp_alpha', alpha);
  closeAll();
  toast('样式已保存 ✓');
}
function initDpSettings(){
  const blur = localStorage.getItem('trikey_dp_blur');
  const alpha = localStorage.getItem('trikey_dp_alpha');
  if(blur){
    document.documentElement.style.setProperty('--dp-blur', blur+'px');
    if(blur == '0'){
      const els = [document.getElementById('dropdownPanel'), document.getElementById('actionSheet'), document.getElementById('settingsModal'), document.getElementById('aboutModal'), document.getElementById('logModal')];
      els.forEach(el => el && el.classList.add('no-blur'));
    }
  }
  if(alpha){document.documentElement.style.setProperty('--dp-alpha', (alpha/100).toFixed(2))}
}

readConfig();
checkMonitor();
setInterval(checkMonitor,10000);

async function checkMonitor(){
  const led=document.getElementById("statusLed");
  const txt=document.getElementById("statusText");
  const r=await exec("cat /data/local/tmp/tri_key/heartbeat 2>/dev/null");
  if(r.errno===0 && r.stdout){
    const ts=parseInt(r.stdout.replace("alive:",""));
    if(Date.now()/1000 - ts < 30){
      led.className="led on"; txt.textContent="监控运行中 ✓";
    }else{led.className="led off"; txt.textContent="监控异常（心跳过期）";}
  }else{
    const b=await exec("cat /data/local/tmp/tri_key/boot.tag 2>/dev/null");
    if(b.errno===0){led.className="led off"; txt.textContent="监控未运行 ✗";}
    else{led.className="led off"; txt.textContent="模块未激活 ✗";}
  }
}
initDpSettings();
</script>

<!-- Settings Modal -->
<div class="modal" id="settingsModal">
  <button class="close-btn" onclick="closeAll()"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
  <h2>界面样式</h2>
  <div class="slider-group">
    <div class="slider-label">
      <span>模糊半径</span>
      <span id="blurVal">1px</span>
    </div>
    <input type="range" id="blurSlider" min="0" max="40" value="1" oninput="updateBlur(this.value)">
  </div>
  <div class="slider-group">
    <div class="slider-label">
      <span>透明度</span>
      <span id="alphaVal">0.08</span>
    </div>
    <input type="range" id="alphaSlider" min="0" max="100" value="8" oninput="updateAlpha(this.value)">
  </div>
</div>

<!-- About Modal -->
<div class="modal" id="aboutModal">
  <button class="close-btn" onclick="closeAll()"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
  <div class="about-content">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15l-4-4 1.41-1.41L11 14.17l5.59-5.59L18 10l-7 7z"/></svg></div>
    <div class="name">玩转三段式</div>
    <div class="ver" id="aboutVersion">版本号 v7.3.0</div>
    <div class="desc">OnePlus/OPPO 三段式按键功能重映射模块</div>
    <div class="contact">反馈 3114490265@qq.com</div>
  </div>
</div>

<!-- Donate Modal -->
<div class="modal" id="donateModal" style="top:calc(50% + 30px)">
  <button class="close-btn" onclick="closeAll()"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
  <h2>赞赏</h2>
  <p style="color:var(--text-secondary);font-size:14px;margin-bottom:16px">支持一下～</p>
  <div style="display:flex;flex-direction:column;gap:16px;align-items:center">
    <img src="donate1.png" style="width:100%;max-width:280px;border-radius:12px;border:1px solid var(--card-border)">
    <img src="donate2.jpg" style="width:100%;max-width:280px;border-radius:12px;border:1px solid var(--card-border)">
  </div>
</div>

<!-- Log Modal -->
<div class="modal" id="logModal" style="top:calc(50% + 30px);max-height:80vh;overflow:hidden">
  <button class="close-btn" onclick="closeAll()"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
  <h2>运行日志</h2>
  <p style="color:var(--text-secondary);font-size:14px;margin-bottom:12px">模块运行记录，保存配置和每次按键都会记录</p>
  <div id="logContent" style="background:rgba(0,0,0,0.35);border-radius:12px;padding:14px;max-height:50vh;overflow-y:auto;font-family:monospace;font-size:12px;line-height:1.7;color:var(--text-secondary);white-space:pre-wrap;word-break:break-all">加载中...</div>
  <button class="btn-primary" onclick="refreshLog()" style="margin-top:12px">刷新日志</button>
</div>

</body>
